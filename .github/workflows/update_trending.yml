name: Update AI Trending

on:
  schedule:
    - cron: '0 14 * * 6'   # 每周六 UTC 14:00 → 北京时间 22:00
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests urllib3
      - name: Fetch trending repos
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        run: python scripts/fetch_trending.py
      - name: Validate JSON
        run: python scripts/validate_json.py docs/data/trending.json
      - name: Commit and push data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/trending.json docs/data/history.json
          git commit -m "🤖 更新 AI 热榜 [$(date +'%Y-%m-%d')]" || echo "No changes"
          git push
      - name: Generate RSS
        run: python scripts/generate_rss.py
      - name: Commit RSS
        run: |
          git add docs/feed.xml
          git commit -m "📡 更新 RSS" || echo "No changes"
          git push
