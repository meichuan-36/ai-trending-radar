name: Update External Platforms

on:
  schedule:
    - cron: '0 2 1 * *'   # 每月1号 UTC 02:00
  workflow_dispatch:

jobs:
  fetch-platforms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch Hugging Face
        run: python scripts/fetch_hf.py
      - name: Fetch Papers With Code
        run: python scripts/fetch_papers.py
      - name: Commit and push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/hf_trending.json docs/data/papers_trending.json
          git commit -m "🌍 更新跨平台热榜 [$(date +'%Y-%m')]" || echo "No changes"
          # 显式设置带 token 的远程地址
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin HEAD:${GITHUB_REF#refs/heads/}
